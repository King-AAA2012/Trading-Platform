<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · {{APP}}</title>
<link rel="stylesheet" href="/css/app.css?v=6">
<style>
  body { overflow: auto; background: var(--bg); }
  .doc { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; line-height: 1.65; font-size: 14.5px; }
  .doc h1 { font-size: 26px; margin: 8px 0 4px; } .doc h2 { font-size: 17px; margin: 26px 0 8px; color: var(--text); }
  .doc p, .doc li { color: #c9d0de; } .doc a { color: var(--accent); }
  :root[data-theme=light] .doc p, :root[data-theme=light] .doc li { color: #2b3446; }
  .doc .box { background: rgba(245,185,66,.1); border: 1px solid rgba(245,185,66,.4); border-radius: 10px; padding: 12px 14px; color: var(--text); }
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .foot { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; border-top: 1px solid var(--line); }
  .foot a { color: var(--muted); margin: 0 8px; }
</style>
</head>
<body>
<div class="top"><a href="/" class="brand" style="color:var(--text)"><div class="logo">▲</div>{{APP}} <small>{{MOTTO}}</small></a></div>
<div class="doc">
  <div class="muted" style="font-size:12px">Last updated: {{UPDATED}}</div>
  <h1>{{TITLE}}</h1>
  {{BODY}}
</div>
<div class="foot"><a href="/legal/terms">Terms</a><a href="/legal/privacy">Privacy</a><a href="/legal/disclaimer">Risk Disclaimer</a><a href="/legal/refund">Refunds</a><a href="/legal/contact">Contact</a>
  <div style="margin-top:6px">© {{ENTITY}} · {{EMAIL}}</div></div>
<script src="/js/ux.js?v=6"></script>
</body>
</html>
