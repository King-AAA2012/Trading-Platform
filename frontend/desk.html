<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Desk · CasuallyHedge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f5b942'/><path d='M6 22l6-7 5 4 9-11' stroke='white' stroke-width='3' fill='none'/></svg>">
<link rel="stylesheet" href="/css/app.css?v=9">
<style>
  body { overflow: auto; }
  .wrap { max-width: 1380px; margin: 0 auto; padding: 14px 18px 40px; }
  .jobs { display: grid; grid-template-columns: repeat(3, 1fr) minmax(230px, .8fr); gap: 12px; margin-bottom: 12px; align-items: stretch; }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .job h4 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .job .meta { font-size: 12px; color: var(--muted); }
  .tabsbar { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tabsbar button { background: none; border: 0; padding: 9px 13px; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; }
  .tabsbar button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabsbar .n { background: var(--down); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 0 6px; margin-left: 4px; }
  .msg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .msg > .hd { display: flex; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; }
  .msg.unread > .hd b { color: var(--text); } .msg.unread > .hd::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .msg > .bd { display: none; padding: 4px 16px 14px; border-top: 1px solid var(--line); }
  .msg.open > .bd { display: block; }
  .bd table { width: auto; margin: 6px 0 10px; } .bd td, .bd th { padding: 4px 10px; font-size: 12.5px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--mono); }
  .bd td:first-child, .bd th:first-child { text-align: left; font-family: var(--sans); }
  .card2 { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card2 h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .tbl-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: 70vh; }
  tr.tracked td { background: var(--accent-bg); }
  .dial { display: inline-flex; gap: 4px; align-items: center; font-family: var(--mono); font-size: 12px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 6px; margin: 2px 4px 2px 0; cursor: pointer; }
  .dial:hover { border-color: var(--accent); }
  .filters2 { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .ev { display: grid; grid-template-columns: 110px 90px 1fr; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: center; }
  .job .check { font-size: 12px; margin-top: 6px; }
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin: 4px 0 8px; }
  .kinds label { font-size: 12.5px; }
  .tag { font-size: 10.5px; border-radius: 5px; padding: 0 6px; margin-right: 3px; background: var(--panel2); border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .tag.h { color: var(--up); border-color: var(--up); } .tag.a { color: var(--accent); border-color: var(--accent); }
  .xbtn { background: none; border: 1px solid var(--line2); color: var(--muted); border-radius: 6px; cursor: pointer; padding: 1px 7px; }
  .xbtn:hover { color: var(--down); border-color: var(--down); }
  .src { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px; margin-left: 4px; }
  @media (max-width: 1250px) { .jobs { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 900px) { .jobs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top" style="height:52px">
  <a class="brand" href="/app" style="color:var(--text)"><div class="logo" style="background:conic-gradient(from 30deg,#f5b942,var(--accent),var(--up),#f5b942)">📬</div>CasuallyHedge <small>Daily Desk</small></a>
  <span class="spacer"></span><span class="muted" style="font-size:12px" id="clock"></span>
  <a class="btn sm" href="/app">← Back to the app</a>
</header>
<div class="wrap">
  <div class="jobs" id="jobs"><div class="empty"><span class="spin"></span></div></div>
  <div class="tabsbar" id="tabs">
    <button data-t="inbox" class="on">📬 Inbox <span class="n" id="nUnread" style="display:none"></span></button><button data-t="portfolio">📁 Portfolio</button>
    <button data-t="roll">⛽ Futures roll cost</button><button data-t="results">📊 Results</button><button data-t="concalls">📞 Concalls & transcripts</button>
    <button data-t="divs">💰 Dividends</button><button data-t="upcoming">📅 Upcoming</button>
  </div>
  <div id="body"></div>
</div>
<script src="/js/common.js?v=8"></script>
<script src="/js/ux.js?v=8"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const { api, esc, price, pct, cls } = TS;
  let D = null, box = [], tab = location.hash.slice(1) || "inbox", rollF = "tracked", rollQ = "", rollSort = ["symbol", 1];
  let rollM = null, gF = "tracked", gK = "all", gR = "all", gSort = null, A = null, P = null;
  const ICON = { roll: "⛽", groll: "🌍", calendar: "📊" };
  const CUR = { USD: "$", JPY: "¥", HKD: "HK$", SGD: "S$", INR: "₹" };
  const fx = (v, d) => v == null ? "–" : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmtT = (t) => t ? new Date(t * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "–";
  const fmtD = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric" }) : "–";
  const ist = () => new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit" });
  setInterval(() => ($("#clock").textContent = `IST ${ist()}`), 1000);

  // markdown with tables (inbox messages contain tables)
  function md(src) {
    const out = [], lines = (src || "").split("\n");
    for (let i = 0; i < lines.length; i++) {
      if (/^\|/.test(lines[i])) {
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { if (!/^\|[\s|:-]+\|$/.test(lines[i])) rows.push(lines[i]); i++; }
        i--;
        const cells = (r) => r.replace(/^\||\|$/g, "").split("|").map((c) => TS.md(c.trim()).replace(/^<p>|<\/p>$/g, ""));
        out.push(`<table>${rows.map((r, k) => `<tr>${cells(r).map((c) => k ? `<td>${c}</td>` : `<th>${c}</th>`).join("")}</tr>`).join("")}</table>`);
      } else out.push(TS.md(lines[i]));
    }
    return out.join("").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  }

  async function load() {
    [D, box, A] = await Promise.all([api("/api/desk"), api("/api/inbox"), api("/api/alerts")]);
    renderJobs(); setTab(tab);
    if (A.job && A.job.running) pollUpdate();
  }
  function renderJobs() {
    const card = (k) => {
      const j = D.status[k], r = j.result || {};
      const res = k === "roll" ? (r.session ? `Session ${r.session} · ${r.count} contracts` : "")
        : k === "groll" ? (r.sessions ? `${Object.entries(r.sessions).map(([n, d]) => `${n.split(" (")[0]} ${d.slice(5)}`).join(" · ")} · ${r.count} contracts` : "")
        : (r.companies != null ? `${r.companies} companies · ${r.new} new item(s)${r.bootstrap ? " · first run (tracker set up)" : ""}` : "");
      return `<div class="job"><h4>${ICON[k]} ${esc(j.label)} ${j.running ? '<span class="spin"></span><span class="muted" style="font-weight:400">running…</span>' : ""}</h4>
        <div class="meta">Runs daily at <b>${j.schedule.join(" & ")}</b> · next ${fmtT(j.next)}</div>
        <div class="meta">Last run: ${j.last ? `${fmtT(j.last)} · ${j.ok ? '<span class="up">✓ ok</span>' : `<span class="down" data-tip="${esc(j.error || "")}">✗ failed</span>`} · ${j.duration}s` : "not yet"}${res ? " · " + esc(res) : ""}</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${D.canRun ? `<button class="btn sm" data-run="${k}" style="margin-top:6px" ${j.running ? "disabled" : ""}>▶ Run now</button>` : ""}
        <label class="check" data-tip="Switch this job's inbox messages (and emails) on or off. The tables on this page keep updating either way."><input type="checkbox" data-mute="${k}" ${D.mute.includes(k) ? "" : "checked"}> Inbox messages</label></div></div>`;
    };
    $("#jobs").innerHTML = card("roll") + card("groll") + card("calendar") + updatesCard();
    $("#updNow").onclick = updateNow;
    $("#alertsBtn").onclick = openAlerts;
    document.querySelectorAll("[data-run]").forEach((b) => (b.onclick = async () => { b.disabled = true; b.innerHTML = '<span class="spin"></span> Running'; await api("/api/desk/run", { body: { job: b.dataset.run } }).catch((e) => TS.toast(e.message)); poll(); }));
    document.querySelectorAll("[data-mute]").forEach((c) => (c.onchange = () => {
      D.mute = [...document.querySelectorAll("[data-mute]")].filter((x) => !x.checked).map((x) => x.dataset.mute);
      api("/api/desk/settings", { body: { mute: D.mute } }).then(() => TS.toast(c.checked ? "Messages on" : "Messages off — tables still update"));
    }));
    const n = box.filter((m) => !m.read).length;
    $("#nUnread").style.display = n ? "" : "none"; $("#nUnread").textContent = n;
  }
  // ---- your updates: interval, email, Update now
  const at = (a) => ["daily", "weekly", "12h"].includes(a.interval) ? ` at ${String(a.hour).padStart(2, "0")}:00${a.interval === "12h" ? ` & ${String((a.hour + 12) % 24).padStart(2, "0")}:00` : ""}${a.interval === "weekly" ? " on " + DAYS[a.weekday] + "s" : ""}` : "";
  const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
  function updStatus() {
    const j = A.job || {}, r = j.result || {};
    if (j.running) return `<span class="spin"></span> Updating your ${A.tracked} companies…`;
    if (j.error) return `<span class="down">Last update failed: ${esc(j.error)}</span>`;
    if (j.finished) return `Last update ${fmtT(j.finished)} · <b>${r.new || 0}</b> new${r.emailed ? ` · email ${esc(r.emailed)}` : ""}`;
    return "";
  }
  function updatesCard() {
    const email = !A.emailOn ? "off" : A.verified ? `to <b>${esc(A.email)}</b>` : `<span class="warn">confirm the code sent to ${esc(A.email)}</span>`;
    return `<div class="job"><h4>🔄 Your updates</h4>
      <div class="meta">Tracking <b>${A.tracked}</b> companies (Portfolio tab) · auto-update <b>${A.configured ? esc(A.intervals[A.interval].toLowerCase()) + at(A) : "with the standard runs"}</b>${A.next ? ` · next ${fmtT(A.next)}` : ""}</div>
      <div class="meta">Email: ${email}${A.lastSent ? ` · last sent ${fmtT(A.lastSent)}` : ""}</div>
      <div class="meta" id="updStatus">${updStatus()}</div>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><button class="btn sm primary" id="updNow" ${A.job && A.job.running ? "disabled" : ""} data-tip="Refresh every company on your Portfolio tab now, update the inbox and email you a digest (if email is on)">🔄 Update now</button>
        <button class="btn sm" id="alertsBtn" data-tip="Choose how often your companies update and what gets emailed to you">📧 Email alerts…</button></div></div>`;
  }
  async function updateNow() {
    const r = await api("/api/desk/refresh", { body: {} }).catch((e) => ({ started: false, reason: e.message }));
    A = r.alerts || A;
    if (!r.started) { TS.toast(r.reason || "Couldn't start the update"); return; }
    renderJobs(); pollUpdate();
  }
  let updT;
  function pollUpdate() {
    clearTimeout(updT);
    updT = setTimeout(async () => {
      A = await api("/api/alerts");
      if (A.job && A.job.running) { const el = $("#updStatus"); if (el) el.innerHTML = updStatus(); pollUpdate(); return; }
      [D, box] = await Promise.all([api("/api/desk"), api("/api/inbox")]);
      renderJobs(); setTab(tab);
      const r = A.job.result || {};
      TS.toast(A.job.error ? "Update failed" : `Updated ${r.companies} companies · ${r.new || 0} new${r.emailed ? " · email " + r.emailed : ""}`, 4000);
    }, 2500);
  }
  async function openAlerts() {
    A = await api("/api/alerts");
    const opt = (v, l, on) => `<option value="${v}" ${on ? "selected" : ""}>${esc(l)}</option>`;
    const body = UX.modal("📧 Email alerts & update interval", `
      <div class="field"><label>Update my companies</label><div style="display:flex;gap:6px;flex-wrap:wrap">
        <select class="in" id="aIv" style="width:auto">${Object.entries(A.intervals).map(([k, l]) => opt(k, l, k === A.interval)).join("")}</select>
        <select class="in" id="aDay" style="width:auto">${DAYS.map((d, i) => opt(i, d + "s", i === A.weekday)).join("")}</select>
        <span id="aAtL" class="dim" style="align-self:center">at</span><select class="in" id="aHour" style="width:auto">${Array.from({ length: 24 }, (_, h) => opt(h, String(h).padStart(2, "0") + ":00", h === A.hour)).join("")}</select>
        <span class="dim" style="align-self:center">your time</span></div>
        <div class="dim" style="font-size:12px;margin-top:4px">Each update refreshes the filings of every company on your Portfolio tab and puts anything new in your inbox. The standard 09:01 & 20:01 IST runs still happen.</div></div>
      <div style="border-top:1px solid var(--line);margin:12px 0 10px"></div>
      <label class="check"><input type="checkbox" id="aOn" ${A.emailOn ? "checked" : ""}> <b>Email me my updates</b></label>
      <div class="field" style="margin-top:8px"><label>Email address</label><input class="in" id="aEm" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(A.email || A.accountEmail || "")}">
        ${A.email && A.verified ? '<div class="up" style="font-size:12px;margin-top:3px">✓ Confirmed</div>' : ""}</div>
      <div id="aCode" style="display:${A.pendingCode && !A.verified ? "block" : "none"};margin-bottom:8px"><div class="dim" id="aCodeMsg" style="font-size:12.5px;margin-bottom:4px">We emailed a 6-digit code to this address. Enter it to start getting emails.</div>
        <div style="display:flex;gap:6px"><input class="in" id="aCd" inputmode="numeric" maxlength="6" placeholder="123456" style="width:120px"><button class="btn sm primary" id="aVer">Confirm</button><button class="btn sm ghost" id="aRe">Send a new code</button></div></div>
      <div class="field"><label>Include</label><div class="kinds">${Object.entries(A.kindLabels).map(([k, l]) => `<label class="check"><input type="checkbox" data-k="${k}" ${A.kinds.includes(k) ? "checked" : ""}> ${esc(l)}</label>`).join("")}</div></div>
      <label class="check"><input type="checkbox" id="aSkip" ${A.skipEmpty ? "checked" : ""}> Skip the email when nothing new was filed (🔄 Update now always emails)</label>
      ${A.emailReady ? "" : `<div class="warn" style="font-size:12.5px;margin-top:8px">Email sending isn't set up on this server yet${A.private ? " (add Gmail SMTP or Resend details to .env, see the README)" : ""}. Your settings are saved and your inbox still updates.</div>`}
      <div style="display:flex;gap:8px;margin-top:14px;align-items:center"><button class="btn primary" id="aSave">Save</button><button class="btn" id="aSaveNow">Save & send one now</button><span class="dim" id="aMsg" style="font-size:12.5px"></span></div>`);
    const sync = () => { const iv = body.querySelector("#aIv").value, timed = ["daily", "weekly", "12h"].includes(iv);
      body.querySelector("#aDay").style.display = iv === "weekly" ? "" : "none"; ["#aHour", "#aAtL"].forEach((x) => (body.querySelector(x).style.display = timed ? "" : "none")); };
    body.querySelector("#aIv").onchange = sync; sync();
    const showCode = (msg) => { body.querySelector("#aCode").style.display = "block"; if (msg) body.querySelector("#aCodeMsg").textContent = msg; body.querySelector("#aCd").focus(); };
    const save = async (extra = {}) => {
      const payload = { interval: body.querySelector("#aIv").value, hour: +body.querySelector("#aHour").value, weekday: +body.querySelector("#aDay").value,
        tz: -new Date().getTimezoneOffset(), email: body.querySelector("#aEm").value.trim(), emailOn: body.querySelector("#aOn").checked,
        kinds: [...body.querySelectorAll("[data-k]")].filter((c) => c.checked).map((c) => c.dataset.k), skipEmpty: body.querySelector("#aSkip").checked, ...extra };
      const r = await api("/api/alerts", { body: payload }).catch((e) => { body.querySelector("#aMsg").innerHTML = `<span class="down">${esc(e.message)}</span>`; return null; });
      if (!r) return null;
      A = r.alerts; renderJobs();
      body.querySelector("#aMsg").innerHTML = r.warning ? `<span class="warn">${esc(r.warning)}</span>` : "Saved ✓";
      if (r.needsCode && !A.verified) showCode(r.sent ? `We emailed a 6-digit code to ${payload.email}. Enter it to start getting emails.` : null);
      return r;
    };
    body.querySelector("#aSave").onclick = async () => { const r = await save(); if (r && (A.verified || !A.emailOn) && !r.warning) { document.getElementById("ux-modal").classList.remove("show"); TS.toast("Saved · next update " + (A.next ? fmtT(A.next) : "soon")); } };
    body.querySelector("#aSaveNow").onclick = async () => { const r = await save(); if (!r) return; if (A.emailOn && !A.verified) return; document.getElementById("ux-modal").classList.remove("show"); updateNow(); };
    body.querySelector("#aRe").onclick = () => save({ resend: true });
    body.querySelector("#aVer").onclick = async () => {
      const r = await api("/api/alerts/verify", { body: { code: body.querySelector("#aCd").value } }).catch((e) => { body.querySelector("#aCodeMsg").innerHTML = `<span class="down">${esc(e.message)}</span>`; return null; });
      if (!r) return;
      A = r.alerts; renderJobs(); body.querySelector("#aCode").style.display = "none"; body.querySelector("#aMsg").innerHTML = '<span class="up">✓ Email confirmed. Your updates will arrive at this address.</span>';
    };
  }

  // ---- portfolio: which companies the desk follows
  async function portfolio() {
    $("#body").innerHTML = `<div class="hint" style="margin-bottom:10px">These are the companies the Daily Desk follows for you: results, concalls, transcripts, dividends, upcoming dates and the futures linked to them.
        Add any stock from any market below. Removing a holding here only stops the desk tracking it; your holding stays as it is.</div>
      <div class="filters2"><div class="search" style="width:360px"><span class="ico">⌕</span><input id="pAdd" class="in" placeholder="Add a company: name or ticker (Apple, RELIANCE, 0700.HK…)" autocomplete="off"><div id="pRes" class="results"></div></div>
        <label class="check"><input type="checkbox" id="pH"> Include my holdings <span class="dim" id="pHn"></span></label>
        <label class="check"><input type="checkbox" id="pW"> Include my watchlists <span class="dim" id="pWn"></span></label>
        <span class="spacer"></span><button class="btn sm primary" id="pUpd">🔄 Update now</button></div>
      <div id="pBody"><div class="empty"><span class="spin"></span></div></div>`;
    TS.bindSearch($("#pAdd"), $("#pRes"), (sym) => editP({ add: sym }, `Added ${sym} · loading its filings…`), { global: false });
    $("#pH").onchange = (e) => editP({ holdings: e.target.checked }, e.target.checked ? "Holdings included" : "Holdings left out");
    $("#pW").onchange = (e) => editP({ watchlists: e.target.checked }, e.target.checked ? "Watchlists included" : "Watchlists left out");
    $("#pUpd").onclick = updateNow;
    P = await api("/api/desk/portfolio");
    renderP();
  }
  function renderP() {
    if (tab !== "portfolio" || !P) return;
    $("#pH").checked = P.holdings; $("#pW").checked = P.watchlists;
    $("#pHn").textContent = `(${P.counts.holdings})`; $("#pWn").textContent = `(${P.counts.watchlists})`;
    const tag = (t) => `<span class="tag ${t === "Holding" ? "h" : t === "Added here" ? "a" : ""}">${esc(t)}</span>`;
    $("#pBody").innerHTML = (P.rows.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Company</th><th>Data</th><th class="r">Price</th><th class="r">Day</th><th>Next up</th><th>Latest results</th><th>Futures</th><th>Why it's here</th><th></th></tr></thead><tbody>
      ${P.rows.map((r) => `<tr><td><a href="/research.html?symbol=${encodeURIComponent(r.symbol)}" target="_blank"><b>${esc(r.symbol)}</b></a><div class="dim" style="font-size:11px">${esc(r.name)}</div></td>
        <td class="dim" style="font-size:11.5px">${r.market ? esc(r.market) : r.updated ? "–" : '<span class="spin"></span> loading filings…'}</td>
        <td class="r num">${r.price == null ? "–" : price(r.price)} <span class="dim" style="font-size:10px">${esc(r.currency || "")}</span></td><td class="r num ${cls(r.changePct)}">${r.changePct == null ? "–" : pct(r.changePct, 2)}</td>
        <td style="font-size:12px">${r.next ? `<b>${fmtD(r.next.date)}</b> <span class="dim">${esc(r.next.what)}</span>` : '<span class="dim">–</span>'}</td>
        <td style="font-size:12px">${r.lastResult ? `${fmtD(r.lastResult.date)} <span class="dim">${esc(r.lastResult.source || "")}</span>` : '<span class="dim">–</span>'}</td>
        <td class="dim" style="font-size:11px">${(r.futures || []).map((f) => esc(f.split(":")[1])).join(", ") || "–"}</td>
        <td>${r.sources.map(tag).join("")}</td><td><button class="xbtn" data-rm="${esc(r.symbol)}" data-tip="Stop following ${esc(r.symbol)} on the Daily Desk">✕</button></td></tr>`).join("")}</tbody></table></div>`
      : empty("Nothing tracked yet. Add a company above, or switch on your holdings / watchlists."))
      + (P.excluded.length ? `<div style="margin-top:12px;font-size:12.5px" class="dim">Not followed on the desk: ${P.excluded.map((s) => `<span class="chip" style="cursor:pointer" data-rs="${esc(s)}" data-tip="Follow again">↺ ${esc(s)}</span>`).join(" ")}</div>` : "");

  // ---- roll cost
  function roll() {

    if (rollF === "tracked" && !rows.length) rows = R.rows.filter((r) => r.kind === "Index");
    const [k, dir] = rollSort, val = (r) => k.includes(".") ? k.split(".").reduce((o, p) => o && o[p], r) : r[k];

        <b>Roll cost</b> = next-month future − near-month future: what it costs to roll a long position forward (a negative roll pays you, often ahead of a dividend). <b>Rollover %</b> = share of open interest already in the next month.</div>
      <div class="filters2">${seg}<div class="seg" id="rf">${[["tracked", "My stocks"], ["all", "All F&O"], ["index", "Indices"], ["neg", "Negative rolls"]].map(([v, l]) => `<button data-v="${v}" class="${rollF === v ? "on" : ""}">${l}</button>`).join("")}</div>
        <input class="in" id="rq" placeholder="Search symbol…" style="width:180px" value="${esc(rollQ)}"><span class="dim" style="font-size:12px">${rows.length} contracts${rollF === "tracked" && !R.rows.some((r) => r.tracked) ? " · none of your stocks are in F&O, showing indices" : ""}</span></div>

        ${th("carryAnn", "Carry p.a.", "Near future vs spot, annualised (cost of carry)")}${th("rollover", "Rollover %")}<th>Rollover trend</th>${th("daysNear", "Days left", "Days to near-month expiry")}</tr></thead><tbody>
        ${rows.map((r) => `<tr class="${r.tracked ? "tracked" : ""}"><td><b>${esc(r.symbol)}</b> <span class="dim" style="font-size:11px">${r.kind === "Index" ? "index" : ""}</span></td><td class="r num">${price(r.spot)}</td>
          <td class="r num">${price(r.near.close)}<div class="dim" style="font-size:10px">${fmtD(r.near.expiry)}</div></td><td class="r num">${price(r.next.close)}<div class="dim" style="font-size:10px">${fmtD(r.next.expiry)}</div></td>

  // ---- international futures roll cost
  function rollIntl(seg) {
    const G = D.groll, all = G.rows || [];
    if (!all.length) { $("#body").innerHTML = `<div class="filters2">${seg}</div>` + empty("The first international roll-cost run hasn't happened yet. It runs at 09:01 IST" + (D.canRun ? ", or press ▶ Run now above." : ".")); return; }
    const kinds = [...new Set(all.map((r) => r.kind))], mkts = [...new Set(all.map((r) => r.market))];
    const pass = (r) => (gK === "all" || r.kind === gK) && (gR === "all" || r.market === gR) && (!rollQ || `${r.symbol} ${r.name} ${r.exchange}`.toUpperCase().includes(rollQ.toUpperCase()));
    let rows = all.filter((r) => pass(r) && (gF === "all" || (gF === "tracked" ? r.tracked : gF === "bench" ? r.bench : gF === "window" ? r.daysNear <= 7 : r.rollPts < 0)));
    const fallback = gF === "tracked" && !rows.length;
    if (fallback) rows = all.filter((r) => pass(r) && r.bench);
    if (gSort) { const [k, dir] = gSort, val = (r) => k.includes(".") ? k.split(".").reduce((o, p) => o && o[p], r) : r[k]; rows = [...rows].sort((a, b) => { const x = val(a), y = val(b); return (typeof x === "string" ? x.localeCompare(y) : (x ?? -1e18) - (y ?? -1e18)) * dir; }); }
    const th = (key, label, tip) => `<th data-g="${key}" class="${["symbol", "exchange"].includes(key) ? "" : "r"}" ${tip ? `data-tip="${esc(tip)}"` : ""}>${label}${gSort && gSort[0] === key ? (gSort[1] > 0 ? " ▲" : " ▼") : ""}</th>`;

        ${(G.errors || []).length ? `<div class="warn" style="margin-top:4px">Last run: ${esc(G.errors.join("; "))} (showing the last good prices for that exchange).</div>` : ""}</div>
      <div class="filters2">${seg}<div class="seg" id="gf">${[["tracked", "My futures"], ["bench", "Benchmarks"], ["all", "All"], ["window", "Roll window ≤7d"], ["neg", "Negative rolls"]].map(([v, l]) => `<button data-v="${v}" class="${gF === v ? "on" : ""}">${l}</button>`).join("")}</div>
        <select class="in" id="gk" style="width:auto"><option value="all">All asset classes</option>${kinds.map((k) => `<option ${gK === k ? "selected" : ""}>${k}</option>`).join("")}</select>
        <select class="in" id="gr" style="width:auto"><option value="all">All markets</option>${mkts.map((m) => `<option ${gR === m ? "selected" : ""}>${m}</option>`).join("")}</select>
        <input class="in" id="rq" placeholder="Search contract…" style="width:170px" value="${esc(rollQ)}"><span class="dim" style="font-size:12px">${rows.length} contracts${fallback ? " · no futures linked to your holdings/watchlists yet (e.g. GC=F, SPY, ^N225, BTC-USD), showing benchmarks" : ""}</span></div>
      <div class="tbl-wrap"><table class="t"><thead><tr>${th("symbol", "Contract")}${th("exchange", "Exchange")}${th("spot", "Spot")}${th("near.close", "Near", "Near contract settlement")}${th("next.close", "Next", "Next contract settlement")}
        ${th("rollPts", "Roll")}${th("rollPct", "Roll %")}${th("rollAnn", "Annualised", "Roll % scaled to a year using the days between the two expiries")}${th("lot", "Size", "Contract multiplier: currency per 1.0 of price")}${th("rollPerLot", "Roll / contract")}
        ${th("carryAnn", "Carry p.a.", "Near future vs spot, annualised (index, FX & crypto)")}${th("rollover", "Rollover %")}<th>Rollover trend</th>${th("daysNear", "Days left", "Days to the near contract's last trading day")}</tr></thead><tbody>
        ${rows.map((r) => { const d = r.decimals ?? 2, c = CUR[r.currency] || r.currency + " "; return `<tr class="${r.tracked ? "tracked" : ""}">
          <td><b>${esc(r.symbol)}</b> <span class="dim" style="font-size:11px">${esc(r.name)}</span><span class="src">${esc(r.kind)}</span>${r.trackedBy && r.trackedBy.length ? `<div class="dim" style="font-size:10.5px">for ${r.trackedBy.map(esc).join(", ")}</div>` : ""}</td>
          <td>${esc(r.exchange)}<div class="dim" style="font-size:10px">${esc(r.market)}</div></td><td class="r num">${r.spot == null ? "–" : fx(r.spot, d)}</td>
          <td class="r num">${fx(r.near.close, d)}<div class="dim" style="font-size:10px">${esc(r.near.month)} · ${fmtD(r.near.expiry)}</div></td><td class="r num">${fx(r.next.close, d)}<div class="dim" style="font-size:10px">${esc(r.next.month)} · ${fmtD(r.next.expiry)}</div></td>
          <td class="r num ${cls(r.rollPts)}">${r.rollPts > 0 ? "+" : ""}${fx(r.rollPts, d)}</td><td class="r num ${cls(r.rollPct)}">${pct(r.rollPct, 2)}</td><td class="r num ${cls(r.rollAnn)}"><b>${pct(r.rollAnn, 1)}</b></td>

  }

      ${all.map(({ s, c, d }) => `<tr class="${d.exDate && d.exDate >= today ? "tracked" : ""}"><td><b>${esc(s)}</b><div class="dim" style="font-size:11px">${esc(c.name || "")}</div></td><td style="white-space:normal;max-width:420px">${esc(d.subject || "")}</td>
        <td class="r num">${d.amount ?? "–"}</td><td>${d.exDate ? fmtD(d.exDate) + (d.exDate >= today ? ' <span class="pill" style="font-size:10px;padding:0 5px">upcoming</span>' : "") : "–"}</td><td>${esc(d.recordDate || "–")}</td><td>${esc(d.payDate || "–")}</td>
        <td>${d.declared ? fmtD(d.declared) : "–"}</td><td class="dim">${esc(d.source || "")}${d.link ? ` · <a href="${esc(d.link)}" target="_blank" rel="noopener noreferrer">filing</a>` : ""}</td></tr>`).join("")
      || '<tr><td colspan="8" class="empty">No dividends recorded yet.</td></tr>'}</tbody></table></div>`;
  }

  // ---- upcoming
  function upcoming() {
    const ev = [], today = new Date().toISOString().slice(0, 10);
    comps().forEach(([s, c]) => {
      (c.events || []).forEach((e) => ev.push({ date: e.date, kind: e.purpose.includes("ividend") && !e.purpose.includes("Result") ? "💰" : "📊", s, name: c.name, what: e.purpose, desc: e.desc }));
      (c.concalls || []).filter((x) => x.status === "upcoming" && x.notice).forEach((x) => ev.push({ date: x.date, kind: "📞", s, name: c.name, what: `Concall ${x.time || ""}`, desc: (x.dialIn || []).join(", ") }));
      (c.dividends || []).filter((d) => d.exDate && d.exDate >= today).forEach((d) => ev.push({ date: d.exDate, kind: "💰", s, name: c.name, what: "Ex-dividend", desc: d.subject }));
    });
    const seen = new Set(), list = ev.filter((e) => e.date && e.date >= today && !seen.has(e.date + e.s + e.what) && seen.add(e.date + e.s + e.what)).sort((a, b) => a.date.localeCompare(b.date));
    $("#body").innerHTML = `<div class="tbl-wrap">${list.map((e) => `<div class="ev"><b>${fmtD(e.date)}</b><span>${e.kind} <a href="/research.html?symbol=${encodeURIComponent(e.s)}" target="_blank">${esc(e.s)}</a></span><span><b>${esc(e.what)}</b> <span class="dim">${esc(e.name || "")}</span>${e.desc ? `<div class="dim" style="font-size:12px">${esc(e.desc)}</div>` : ""}</span></div>`).join("")
      || empty("Nothing scheduled yet for your companies.")}</div>`;
  }

  // keep refreshing while a job is running or the very first runs haven't finished yet
  load().then(() => { if (Object.values(D.status).some((j) => j.running || !j.last)) poll(); });
  setInterval(async () => { const r = await api("/api/inbox?unread=1").catch(() => null); if (r && r.unread !== box.filter((m) => !m.read).length) { box = await api("/api/inbox"); D = await api("/api/desk"); renderJobs(); if (tab === "inbox") inbox(); } }, 60000);
})();
</script>
</body>
