<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeScope · Research</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%239b7bff'/><path d='M6 22l6-7 5 4 9-11' stroke='white' stroke-width='3' fill='none'/></svg>">
<link rel="stylesheet" href="/css/app.css">
<style>
  .grid.res { grid-template-columns: minmax(0, 1fr) 470px; }
  .quote { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .quote h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  .quote .nm { color: var(--muted); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote .px { font-family: var(--mono); font-size: 20px; font-weight: 600; }
  .charts { display: grid; grid-template-rows: 1fr 90px 90px 90px; gap: 1px; background: var(--line); flex: 1; min-height: 0; }
  .charts > div { background: var(--panel); position: relative; min-height: 0; }
  .charts .lbl { position: absolute; left: 8px; top: 4px; z-index: 3; font-size: 10.5px; color: var(--muted); pointer-events: none; }
  body:not(.pro) .charts { grid-template-rows: 1fr 120px; }
  body:not(.pro) .charts .rsi, body:not(.pro) .charts .macd { display: none; }
  .legend { position: absolute; left: 10px; top: 8px; z-index: 3; font-size: 11.5px; font-family: var(--mono); pointer-events: none; display: flex; gap: 12px; flex-wrap: wrap; }
  .rec { border-radius: 12px; padding: 14px; background: linear-gradient(160deg, #121a2b, #0e1320); border: 1px solid var(--line2); }
  .rec .action { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  .rec .howmuch { font-size: 14px; margin: 6px 0 10px; }
  .ring-score { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ring-score > div { width: 50px; height: 50px; border-radius: 50%; background: #0e1320; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 16px; }
  .ladder { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; font-size: 12.5px; margin-top: 10px; }
  .ladder .l { color: var(--muted); }
  .news a { display: block; padding: 8px 0; border-bottom: 1px solid #151c29; color: var(--text); }
  .news a:hover .tt { color: var(--accent); }
  .news .meta { color: var(--dim); font-size: 11px; }
  #chat { display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 10px; border-radius: 9px; background: var(--panel2); }
  .msg.user { background: var(--accent-bg); align-self: flex-end; max-width: 85%; }
  .rsection { margin-bottom: 14px; }
  .rsection h4 { margin: 0 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
</style>
</head>
<body>
<div class="app research">
  <header class="top">
    <div class="brand"><div class="logo" style="background:conic-gradient(from 30deg,var(--accent2),var(--accent),var(--up),var(--accent2))">◆</div>TradeScope <small>Research</small></div>
    <div class="search" style="width:240px"><span class="ico">⌕</span><input id="q" class="in" placeholder="Symbol…  ( / )" autocomplete="off"><div id="qres" class="results"></div></div>
    <div class="quote" id="quote"><span class="muted">Select a symbol on the Command screen</span></div>
    <div class="spacer"></div>
    <span id="aist" class="pill"><span class="dot"></span>AI…</span>
    <div class="seg"><button data-mode="beginner">Beginner</button><button data-mode="pro">Pro</button></div>
    <button class="btn" id="watchBtn">☆ Watch</button>
    <button class="btn" id="reportBtn">📄 Full report</button>
  </header>
  <main class="grid res">
    <section class="panel">
      <div class="ph">
        <div class="seg" id="tf"><button data-tf="1D">1D</button><button data-tf="5D">5D</button><button data-tf="3M">3M</button><button data-tf="6M">6M</button><button data-tf="1Y" class="on">1Y</button><button data-tf="2Y">2Y</button><button data-tf="5Y">5Y</button></div>
        <span class="spacer"></span>
        <label class="check"><input type="checkbox" id="oEma" checked> EMA 20/50/200</label>
        <label class="check"><input type="checkbox" id="oBb"> Bollinger</label>
        <label class="check"><input type="checkbox" id="oSig" checked> Signals</label>
        <label class="check"><input type="checkbox" id="oLv" checked> Trade levels</label>
      </div>
      <div class="charts">
        <div id="cMain"><div class="legend" id="legend"></div></div>
        <div id="cRsi" class="rsi"><span class="lbl">RSI 14</span></div>
        <div id="cMacd" class="macd"><span class="lbl">MACD 12/26/9</span></div>
        <div id="cScore"><span class="lbl">TradeScope Score (−100 … +100). Green = buy zone, red = sell zone</span></div>
      </div>
    </section>
    <div class="col">
      <section class="panel" style="flex:none"><div class="pb" id="rec"><div class="empty">No symbol selected.</div></div></section>
      <section class="panel" style="flex:1">
        <div class="ph"><div class="tabs" id="rtabs"><button data-t="why" class="on">Why</button><button data-t="fund">Fundamentals</button><button data-t="bt">Backtest</button><button data-t="news">News</button><button data-t="ai">✨ AI Analyst</button></div></div>
        <div class="pb" id="tabBody"></div>
      </section>
    </div>
  </main>
</div>
<script src="/vendor/lwc.js"></script>
<script src="/js/common.js"></script>
<script src="/js/research.js"></script>
</body>
</html>
