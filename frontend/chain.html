<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply chain · CasuallyHedge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2338bdf8'/><path d='M6 22l6-7 5 4 9-11' stroke='white' stroke-width='3' fill='none'/></svg>">
<link rel="stylesheet" href="/css/app.css?v=9">
<style>
  .app.chain { grid-template-rows: 52px 1fr; }
  .grid.ch { grid-template-columns: minmax(0, 1fr) 400px; }
  .quote { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .quote h1 { font-size: 18px; margin: 0; } .quote .nm { color: var(--muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #viewport { position: relative; flex: 1; overflow: hidden; cursor: grab; background:
    radial-gradient(circle at 1px 1px, rgba(135,145,166,.13) 1px, transparent 0) 0 0 / 22px 22px; }
  #viewport.drag { cursor: grabbing; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #edges path { fill: none; transition: opacity .15s, stroke-width .15s; }
  #edges path.hit { pointer-events: stroke; stroke: transparent !important; stroke-width: 12px !important; cursor: help; }
  .col-h { position: absolute; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; text-align: center; font-weight: 600; }
  .col-h small { display: block; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--dim); }
  .nd { position: absolute; width: 184px; min-height: 58px; background: var(--panel); border: 1px solid var(--line2); border-left: 4px solid var(--c, var(--line2));
        border-radius: 10px; padding: 6px 9px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25); transition: opacity .15s, transform .12s, box-shadow .15s; user-select: none; }
  .nd:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
  .nd .r1 { display: flex; justify-content: space-between; gap: 6px; font-weight: 700; font-size: 12.5px; }
  .nd .r1 .chg { font-family: var(--mono); font-weight: 600; font-size: 11.5px; }
  .nd .nm { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nd .wt { font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .nd.focus { width: 210px; min-height: 74px; border: 2px solid var(--accent); background: linear-gradient(160deg, rgba(91,140,255,.18), var(--panel)); }
  .nd.focus .r1 { font-size: 15px; }
  .nd.ai { border-style: dashed; } .nd.ai::after { content: "AI · unverified"; position: absolute; top: -9px; right: 8px; font-size: 9.5px; background: var(--warn); color: #000; border-radius: 5px; padding: 0 5px; font-weight: 700; }
  .nd.dim, #edges path.dim { opacity: .12; }
  .nd.sel { box-shadow: 0 0 0 2px var(--text), 0 10px 26px rgba(0,0,0,.4); }
  .nd.hit { box-shadow: 0 0 0 2px var(--down), 0 10px 26px rgba(255,84,112,.35); }
  .grp { position: absolute; width: 230px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 8px 10px; border-top: 3px solid var(--c, var(--line2)); }
  .grp h5 { margin: 0 0 6px; font-size: 12px; } .grp .chipc { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 5px; border-radius: 6px; cursor: pointer; }
  .grp .chipc:hover { background: var(--accent-bg); } .grp .more { font-size: 10.5px; color: var(--dim); margin-top: 4px; }
  .grp.name { width: 170px; text-align: center; color: var(--muted); font-size: 12px; padding: 10px; border-style: dashed; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
  .legend { position: absolute; left: 12px; bottom: 10px; z-index: 5; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .banner { margin: 8px 12px 0; }
  .rel { display: grid; grid-template-columns: 1fr auto; gap: 6px; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .rel:hover { color: var(--accent); }
  .imp { letter-spacing: 1px; color: var(--warn); font-size: 10px; }
  .sec h4 { margin: 14px 0 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  @media (max-width: 1200px) { .grid.ch { grid-template-columns: minmax(0, 1fr) 330px; } }
  @media (max-width: 900px) { body { overflow: auto; } .app.chain { height: auto; } .grid.ch { grid-template-columns: 1fr; } #mainPanel { height: 70vh; } }
</style>
</head>
<body>
<div class="app chain">
  <header class="top">
    <a class="brand" href="/app" style="color:var(--text)"><div class="logo" style="background:conic-gradient(from 30deg,#38bdf8,var(--accent),var(--up),#38bdf8)">⛓</div>CasuallyHedge <small>Supply Chain</small></a>
    <div class="search" style="width:240px"><span class="ico">⌕</span><input id="q" class="in" placeholder="Any company… ( / )" autocomplete="off"><div id="qres" class="results"></div></div>
    <div class="quote" id="quote"></div>
    <div class="spacer"></div>
    <div class="seg" id="view"><button data-v="company" class="on" data-tip="Verified company-to-company supplier & customer links">🏢 Company links</button><button data-v="industry" data-tip="Which industries feed this one and which it sells to, filled with real companies">🏭 Industry chain</button></div>
    <button class="btn" id="aiMore" data-tip="Ask the local AI to suggest more suppliers & customers. Shown dashed and marked unverified.">✨ AI: find more links</button>
    <button class="btn" id="toResearch">🔍 Research</button>
  </header>
  <main class="grid ch">
    <section class="panel" id="mainPanel">
      <div id="banner"></div>
      <div id="viewport"><div id="stage"><svg id="edges"></svg></div>
        <div class="zoom"><button class="btn sm" id="zin" data-tip="Zoom in">＋</button><button class="btn sm" id="zout" data-tip="Zoom out">－</button><button class="btn sm" id="zfit" data-tip="Fit to screen">⤢</button></div>
        <div class="legend"><span><i style="background:#5b8cff"></i>Supplier</span><span><i style="background:#93b4ff"></i>Supplier's supplier</span><span><i style="background:#1fd286"></i>Customer</span><span><i style="background:#8be7bd"></i>Customer's customer</span><span><i style="background:#9b7bff"></i>Shares suppliers</span><span>Thicker line = more critical</span></div>
      </div>
    </section>
    <section class="panel"><div class="pb" id="side"><div class="empty"><span class="spin"></span> Mapping the supply chain…</div></div></section>
  </main>
</div>
<script src="/js/common.js?v=7"></script>
<script src="/js/ux.js?v=7"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const { api, esc, price, pct, cls } = TS;
  const params = new URLSearchParams(location.search);
  let sym = params.get("symbol") || "AAPL", G = null, view = "company", sel = null, aiLinks = null;
  const ROLE = { focus: ["var(--accent)", "This company"], supplier: ["#5b8cff", "Supplier"], supplier2: ["#93b4ff", "Supplier's supplier"], customer: ["#1fd286", "Customer"],
    customer2: ["#8be7bd", "Customer's customer"], sibling: ["#9b7bff", "Shares suppliers"], "ai-supplier": ["#f5b942", "Supplier (AI, unverified)"], "ai-customer": ["#f5b942", "Customer (AI, unverified)"] };
  TS.setMode(TS.mode(), false);
  TS.bindSearch($("#q"), $("#qres"), (s) => go(s));
  const go = (s) => { location.search = `?symbol=${encodeURIComponent(s)}`; };
  $("#toResearch").onclick = () => window.open(`/research.html?symbol=${encodeURIComponent(sym)}`, "_blank");

  // ---------------- pan & zoom
  let zx = 0, zy = 0, zs = 1;
  const apply = () => ($("#stage").style.transform = `translate(${zx}px,${zy}px) scale(${zs})`);
  const vp = $("#viewport");
  let drag = null;
  vp.addEventListener("mousedown", (e) => { if (e.target.closest(".nd,.grp,.zoom,.legend,button")) return; drag = { x: e.clientX - zx, y: e.clientY - zy }; vp.classList.add("drag"); });
  window.addEventListener("mousemove", (e) => { if (drag) { zx = e.clientX - drag.x; zy = e.clientY - drag.y; apply(); } });
  window.addEventListener("mouseup", () => { drag = null; vp.classList.remove("drag"); });
  vp.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.offsetX, e.offsetY); }, { passive: false });
  function zoomAt(f, cx, cy) { const n = Math.min(2.2, Math.max(0.25, zs * f)); zx = cx - (cx - zx) * (n / zs); zy = cy - (cy - zy) * (n / zs); zs = n; apply(); }
  $("#zin").onclick = () => zoomAt(1.2, vp.clientWidth / 2, vp.clientHeight / 2);
  $("#zout").onclick = () => zoomAt(1 / 1.2, vp.clientWidth / 2, vp.clientHeight / 2);
  $("#zfit").onclick = () => fit();
  let W = 1000, Ht = 600;
  function fit() { const s = Math.min(vp.clientWidth / (W + 40), vp.clientHeight / (Ht + 40), 1.15); zs = Math.max(0.25, s); zx = (vp.clientWidth - W * zs) / 2; zy = Math.max(10, (vp.clientHeight - Ht * zs) / 2); apply(); }
  window.addEventListener("resize", () => fit());

  // ---------------- load
  async function load() {
    try { G = await api(`/api/chain/${encodeURIComponent(sym)}`); } catch (e) { $("#side").innerHTML = `<div class="empty">Couldn't map ${esc(sym)}: ${esc(e.message)}</div>`; return; }
    sym = G.symbol;
    document.title = `${sym} supply chain · CasuallyHedge`;
    const f = G.nodes[sym];
    $("#quote").innerHTML = `<h1>${esc(sym)}</h1><span class="nm">${esc(f.name)}</span><span class="num" style="font-size:17px;font-weight:600">${price(f.price)}</span><span class="num ${cls(f.changePct)}">${pct(f.changePct)}</span>${f.signal ? `<span class="sig ${TS.sigClass(f.signal)}">${f.signal}</span>` : ""}`;
    if (!G.verified && view === "company" && !aiLinks) setView("industry"); else render();
    side();
  }
  function setView(v) { view = v; document.querySelectorAll("#view button").forEach((b) => b.classList.toggle("on", b.dataset.v === v)); render(); }
  document.querySelectorAll("#view button").forEach((b) => (b.onclick = () => setView(b.dataset.v)));

  // ---------------- company graph
  function nodesAndEdges() {
    const nodes = { ...G.nodes }, edges = [...G.edges];
    if (aiLinks) {
      aiLinks.suppliers.forEach((x) => { if (!nodes[x.symbol]) nodes[x.symbol] = { ...x, tier: -1, role: "ai-supplier", ai: true }; edges.push({ from: x.symbol, to: sym, what: x.what, importance: 1, kind: "ai" }); });
      aiLinks.customers.forEach((x) => { if (!nodes[x.symbol]) nodes[x.symbol] = { ...x, tier: 1, role: "ai-customer", ai: true }; edges.push({ from: sym, to: x.symbol, what: x.what, importance: 1, kind: "ai" }); });
    }
    return { nodes, edges };
  }
  const NW = 184, NH = 64, GAPY = 14, COLX = [0, 250, 520, 820, 1090];
  function render() {
    const stage = $("#stage");
    stage.querySelectorAll(".nd,.grp,.col-h").forEach((x) => x.remove());
    $("#banner").innerHTML = view === "company" && !G.verified && !aiLinks
      ? `<div class="hint banner">No verified company links for <b>${esc(sym)}</b> in our database yet. Use <b>🏭 Industry chain</b> or <b>✨ AI: find more links</b> (unverified).</div>`
      : aiLinks && view === "company" ? `<div class="hint banner" style="border-color:var(--warn)">⚠️ Dashed boxes are <b>AI suggestions</b> from the local model. They can be wrong; check company filings before relying on them.</div>` : "";
    if (view === "industry") return renderIndustry();
    const { nodes, edges } = nodesAndEdges();
    const cols = { "-2": [], "-1": [], "0": [], "1": [], "2": [] };
    Object.values(nodes).forEach((n) => cols[String(n.tier)].push(n.symbol));
    const imp = (a, b) => Math.max(0, ...edges.filter((e) => (e.from === a && e.to === b) || (e.from === b && e.to === a)).map((e) => e.importance));
    const pos = {};
    const place = (k, order) => {
      const list = order;
      const x = COLX[+k + 2], startY = 46;
      list.forEach((s, i) => (pos[s] = { x, y: startY + i * (NH + GAPY) }));
    };
    const byImp = (list) => list.sort((a, b) => imp(b, sym) - imp(a, sym) || a.localeCompare(b));
    place("-1", byImp(cols["-1"])); place("1", byImp(cols["1"]));
    const bary = (s, nb, dir) => { const ys = edges.filter((e) => (dir < 0 ? e.from === s && pos[e.to] && nodes[e.to].tier === nb : e.to === s && pos[e.from] && nodes[e.from].tier === nb)).map((e) => pos[dir < 0 ? e.to : e.from].y); return ys.length ? ys.reduce((a, b) => a + b) / ys.length : 1e6; };
    place("-2", cols["-2"].sort((a, b) => bary(a, -1, -1) - bary(b, -1, -1)));
    place("2", cols["2"].sort((a, b) => bary(a, 1, 1) - bary(b, 1, 1)));
    const sib = cols["0"].filter((s) => s !== sym).sort((a, b) => (G.shared[b] || []).length - (G.shared[a] || []).length);
    // focus in the middle of the tallest column, siblings stacked below a gap
    const colH = (k) => cols[k].length * (NH + GAPY);
    pos[sym] = { x: COLX[2] - 13, y: Math.max(46, (Math.max(colH("-1"), colH("1")) / 2) - 37 + 46) };
    sib.forEach((s, i) => (pos[s] = { x: COLX[2], y: pos[sym].y + 110 + i * (NH + GAPY) }));
    // vertically centre each column on the focus
    ["-2", "-1", "1", "2"].forEach((k) => {
      if (!cols[k].length) return;
      const ys = cols[k].map((s) => pos[s].y), mid = (Math.min(...ys) + Math.max(...ys) + NH) / 2, shift = pos[sym].y + 37 - mid;
      cols[k].forEach((s) => (pos[s].y = Math.max(46, pos[s].y + shift)));
    });
    W = COLX[4] + NW + 20;
    Ht = Math.max(...Object.values(pos).map((p) => p.y)) + NH + 30;
    const heads = [["Suppliers' suppliers", "tier 2 upstream"], ["Suppliers", "who they buy from"], ["This company", sib.length ? "+ others using the same suppliers" : ""], ["Customers", "who they sell to"], ["Customers' customers", "tier 2 downstream"]];
    heads.forEach(([h, sm], i) => { const d = document.createElement("div"); d.className = "col-h"; d.style.cssText = `left:${COLX[i] - 10}px;top:2px;width:${NW + 20}px`; d.innerHTML = `${h}<small>${sm}</small>`; stage.appendChild(d); });
    Object.values(nodes).forEach((n) => {
      const p = pos[n.symbol]; if (!p) return;
      const d = document.createElement("div");
      d.className = "nd" + (n.symbol === sym ? " focus" : "") + (n.ai ? " ai" : "");
      d.dataset.s = n.symbol;
      d.style.cssText = `left:${p.x}px;top:${p.y}px;--c:${(ROLE[n.role] || ROLE.supplier)[0]}`;
      const rel = edges.find((e) => (e.from === n.symbol && e.to === sym) || (e.from === sym && e.to === n.symbol));
      const why = n.role === "sibling" ? `shares ${(G.shared[n.symbol] || []).length} supplier(s)` : rel ? rel.what : n.role === "supplier2" ? `supplies ${edges.filter((e) => e.from === n.symbol && nodes[e.to]?.tier === -1).map((e) => e.to).join(", ")}` : n.role === "customer2" ? `buys from ${edges.filter((e) => e.to === n.symbol && nodes[e.from]?.tier === 1).map((e) => e.from).join(", ")}` : "";
      d.innerHTML = `<div class="r1"><span>${esc(n.symbol)}</span><span class="chg ${cls(n.changePct)}">${n.changePct == null ? "" : pct(n.changePct, 1)}</span></div><div class="nm">${esc(n.name || "")}</div><div class="wt">${esc(why)}</div>`;
      d.dataset.tip = `${n.name || n.symbol} · ${(ROLE[n.role] || [0, ""])[1]}${n.score != null ? ` · score ${Math.round(n.score)}` : ""}\nClick for details · double-click to centre the chain here`;
      d.onclick = () => select(n.symbol);
      d.ondblclick = () => go(n.symbol);
      d.onmouseenter = () => hover(n.symbol);
      d.onmouseleave = () => hover(null);
      stage.appendChild(d);
    });
    drawEdges(edges, pos, nodes);
    fit();
  }
  function drawEdges(edges, pos, nodes) {
    const svg = $("#edges");
    svg.setAttribute("width", W); svg.setAttribute("height", Ht);
    const out = [];
    edges.forEach((e, i) => {
      const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      const aw = e.from === sym ? 210 : NW, ah = e.from === sym ? 74 : NH, bh = e.to === sym ? 74 : NH;
      let x1 = a.x + aw, y1 = a.y + ah / 2, x2 = b.x, y2 = b.y + bh / 2, d;
      if (x2 > x1 + 10) { const dx = (x2 - x1) * 0.5; d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`; }
      else { x1 = a.x + aw; x2 = b.x + (e.to === sym ? 210 : NW); const bulge = 60 + Math.abs(y2 - y1) * 0.15; d = `M${x1},${y1} C${x1 + bulge},${y1} ${x2 + bulge},${y2} ${x2},${y2}`; }
      const col = e.to === sym ? "#5b8cff" : e.from === sym ? "#1fd286" : nodes[e.to]?.role === "sibling" ? "#9b7bff" : "#6b7489";
      const w = [0, 1.1, 2, 3.2][e.importance] || 1;
      out.push(`<path data-i="${i}" data-a="${esc(e.from)}" data-b="${esc(e.to)}" d="${d}" stroke="${col}" stroke-width="${w}" opacity="${e.from === sym || e.to === sym ? .9 : .45}" ${e.kind === "ai" ? 'stroke-dasharray="5 4"' : ""}/>
        <path class="hit" data-a="${esc(e.from)}" data-b="${esc(e.to)}" d="${d}" data-tip="${esc(`${e.from} → ${e.to}: ${e.what}${e.kind === "ai" ? " (AI, unverified)" : ""} · importance ${e.importance}/3`)}"/>`);
    });
    svg.innerHTML = out.join("");
  }
  function hover(s) {
    if (sel && sel.disrupt) return;
    const { edges } = nodesAndEdges();
    const near = new Set(s ? [s, ...edges.filter((e) => e.from === s || e.to === s).flatMap((e) => [e.from, e.to])] : []);
    document.querySelectorAll(".nd").forEach((d) => d.classList.toggle("dim", !!s && !near.has(d.dataset.s)));
    document.querySelectorAll("#edges path:not(.hit)").forEach((p) => p.classList.toggle("dim", !!s && p.dataset.a !== s && p.dataset.b !== s));
  }

  // downstream contagion: everything reachable from `s` following supplier -> customer links
  function downstream(s) {
    const { edges } = nodesAndEdges(), hit = new Set([s]), q = [s];
    while (q.length) { const x = q.shift(); edges.filter((e) => e.from === x).forEach((e) => { if (!hit.has(e.to)) { hit.add(e.to); q.push(e.to); } }); }
    return hit;
  }

  // ---------------- industry view
  function renderIndustry() {
    const stage = $("#stage"), I = G.industry, f = G.nodes[sym];
    const up2 = [...new Set(I.up.flatMap((g) => g.up || []))].filter((x) => !I.up.some((g) => g.industry === x) && x !== I.industry).slice(0, 8);
    const down2 = [...new Set(I.down.flatMap((g) => g.down || []))].filter((x) => !I.down.some((g) => g.industry === x) && x !== I.industry).slice(0, 8);
    const X = [0, 220, 500, 790, 1070], boxes = [];
    const grpH = (g) => 40 + Math.min(g.companies.length, 6) * 24 + (g.companies.length > 6 ? 16 : 0);
    const col = (items, x, kind) => { let y = 46; items.forEach((it) => { const h = kind === "name" ? 44 : grpH(it); boxes.push({ ...it, x, y, h, kind }); y += h + 16; }); return y; };
    const h1 = col(up2.map((n) => ({ industry: n })), X[0], "name"), h2 = col(I.up, X[1], "up");
    const centre = { industry: I.industry || "(unknown industry)", companies: [f, ...I.peers.slice(0, 7)] };
    col([centre], X[2], "focus");
    const h4 = col(I.down.length ? I.down : [{ industry: "End consumers & businesses", companies: [] }], X[3], "down"), h5 = col(down2.map((n) => ({ industry: n })), X[4], "name");
    W = X[4] + 190; Ht = Math.max(h1, h2, h4, h5, grpH(centre) + 70) + 20;
    // centre columns vertically
    [X[0], X[1], X[3], X[4]].forEach((x) => { const bs = boxes.filter((b) => b.x === x); if (!bs.length) return; const tot = bs[bs.length - 1].y + bs[bs.length - 1].h - 46, off = Math.max(0, (Ht - 40 - tot) / 2); bs.forEach((b) => (b.y += off)); });
    const fb = boxes.find((b) => b.kind === "focus"); fb.y = Math.max(46, (Ht - fb.h) / 2);
    [["Inputs to the inputs", ""], ["Supplier industries", "who they buy from"], ["This company's industry", I.sector || ""], ["Customer industries", "who they sell to"], ["Further downstream", ""]]
      .forEach(([h, sm], i) => { const d = document.createElement("div"); d.className = "col-h"; d.style.cssText = `left:${X[i]}px;top:2px;width:${i === 0 || i === 4 ? 170 : 230}px`; d.innerHTML = `${h}<small>${sm}</small>`; stage.appendChild(d); });
    const colr = { up: "#5b8cff", down: "#1fd286", focus: "var(--accent)", name: "var(--line2)" };
    boxes.forEach((b) => {
      const d = document.createElement("div");
      d.className = b.kind === "name" ? "grp name" : "grp";
      d.style.cssText = `left:${b.x}px;top:${b.y}px;--c:${colr[b.kind]}${b.kind === "focus" ? ";border:2px solid var(--accent)" : ""}`;
      if (b.kind === "name") d.textContent = b.industry;
      else d.innerHTML = `<h5>${esc(b.industry)}</h5>${(b.companies || []).slice(0, 6).map((c) => `<div class="chipc" data-s="${esc(c.symbol)}" data-tip="${esc(c.name || c.symbol)}${c.score != null ? ` · score ${Math.round(c.score)}` : ""} · double-click to map its chain"><span><b>${esc(c.symbol)}</b> <span class="dim">${esc((c.name || "").slice(0, 16))}</span></span><span class="num ${cls(c.changePct)}">${c.changePct == null ? "" : pct(c.changePct, 1)}</span></div>`).join("")}
        ${(b.companies || []).length > 6 ? `<div class="more">+${b.companies.length - 6} more</div>` : (b.companies || []).length ? "" : `<div class="more">${b.kind === "down" ? "Sells mainly to end customers" : "No companies loaded yet. Scan more markets to fill this in."}</div>`}`;
      d.querySelectorAll(".chipc").forEach((c) => { c.onclick = () => select(c.dataset.s, true); c.ondblclick = () => go(c.dataset.s); });
      stage.appendChild(d);
      b.el = d;
    });
    const link = (a, b2, color) => { const x1 = a.x + (a.kind === "name" ? 170 : 230), y1 = a.y + a.h / 2, x2 = b2.x, y2 = b2.y + b2.h / 2, dx = (x2 - x1) / 2; return `<path d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" stroke="${color}" stroke-width="1.6" opacity=".55"/>`; };
    const paths = [];
    boxes.filter((b) => b.kind === "up").forEach((b) => { paths.push(link(b, fb, "#5b8cff")); boxes.filter((n) => n.kind === "name" && n.x === X[0] && (b.up || []).includes(n.industry)).forEach((n) => paths.push(link(n, b, "#6b7489"))); });
    boxes.filter((b) => b.kind === "down").forEach((b) => { paths.push(link(fb, b, "#1fd286")); boxes.filter((n) => n.kind === "name" && n.x === X[4] && (b.down || []).includes(n.industry)).forEach((n) => paths.push(link(b, n, "#6b7489"))); });
    const svg = $("#edges"); svg.setAttribute("width", W); svg.setAttribute("height", Ht); svg.innerHTML = paths.join("");
    fit();
  }

  // ---------------- side panel
  function side() {
    if (sel && G.nodes[sel.s] === undefined && !(aiLinks && [...aiLinks.suppliers, ...aiLinks.customers].some((x) => x.symbol === sel.s)) && !sel.loose) sel = null;
    if (sel) return details(sel.s);
    const S = G.stats, f = G.nodes[sym], { edges } = nodesAndEdges();
    const rel = (e) => `<div class="rel" data-s="${esc(e.from === sym ? e.to : e.from)}"><span><b>${esc(e.from)}</b> → <b>${esc(e.to)}</b><div class="dim" style="font-size:11px">${esc(e.what)}${e.kind === "ai" ? " · AI, unverified" : ""}</div></span><span class="imp" data-tip="Importance ${e.importance}/3">${"●".repeat(e.importance)}${"○".repeat(3 - e.importance)}</span></div>`;
    const sibs = Object.entries(G.shared).filter(([c]) => G.nodes[c]?.role === "sibling");
    $("#side").innerHTML = `<div class="kv" style="grid-template-columns:repeat(2,1fr)">
        <div><label>Suppliers</label><b>${S.suppliers}</b></div><div><label>Customers</label><b>${S.customers}</b></div>
        <div data-tip="Average move today of everything upstream"><label>Suppliers today</label><b class="${cls(S.upDay)}">${S.upDay == null ? "–" : pct(S.upDay, 2)}</b></div>
        <div data-tip="Average move today of everything downstream"><label>Customers today</label><b class="${cls(S.downDay)}">${S.downDay == null ? "–" : pct(S.downDay, 2)}</b></div></div>
      ${S.critical.length ? `<div class="hint" style="margin-top:10px">⚠️ <b>Critical dependencies:</b> ${S.critical.map((c) => `<a href="#" data-s="${esc(c)}">${esc(c)}</a>`).join(", ")}. Disruption at any of these would hit ${esc(f.name)} hard. Click one, then <b>"What if it's disrupted?"</b></div>` : ""}
      <div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm primary" id="explain">✨ Explain this chain</button></div>
      <div id="aiOut" class="md" style="margin-top:8px"></div>
      <div class="sec"><h4>Verified relationships (${edges.filter((e) => e.kind !== "ai").length})</h4>${edges.filter((e) => e.from === sym || e.to === sym).sort((a, b) => b.importance - a.importance).map(rel).join("") || '<div class="dim" style="font-size:12px">None in our database for this company yet.</div>'}</div>
      ${sibs.length ? `<div class="sec"><h4>Who else relies on the same suppliers</h4>${sibs.sort((a, b) => b[1].length - a[1].length).map(([c, via]) => `<div class="rel" data-s="${esc(c)}"><span><b>${esc(c)}</b> <span class="dim">${esc(G.nodes[c]?.name || "")}</span><div class="dim" style="font-size:11px">also buys from ${via.map(esc).join(", ")}: competes for the same capacity</div></span><span class="num ${cls(G.nodes[c]?.changePct)}">${pct(G.nodes[c]?.changePct, 1)}</span></div>`).join("")}</div>` : ""}
      ${edges.filter((e) => e.from !== sym && e.to !== sym).length ? `<div class="sec"><h4>Wider chain links</h4>${edges.filter((e) => e.from !== sym && e.to !== sym).sort((a, b) => b.importance - a.importance).slice(0, 40).map(rel).join("")}</div>` : ""}
      <div class="sec"><h4>Industry: ${esc(G.industry.industry || "unknown")}</h4><div class="muted" style="font-size:12px">Buys from <b>${G.industry.up.map((x) => esc(x.industry)).join(", ") || "—"}</b>; sells to <b>${G.industry.down.map((x) => esc(x.industry)).join(", ") || "end customers"}</b>. Switch to <b>🏭 Industry chain</b> to see the companies in each.</div></div>
      <p class="disclaimer" style="margin-top:14px">${esc(G.asOf)} Company links come from public filings and widely reported deals; industry chains are general maps. Not a complete list of any company's suppliers or customers.</p>`;
    $("#side").querySelectorAll("[data-s]").forEach((el) => (el.onclick = (e) => { e.preventDefault(); select(el.dataset.s); }));
    $("#explain").onclick = () => streamAI({ symbol: sym });
  }
  async function streamAI(body) {
    const out = $("#aiOut"); out.classList.add("cursor"); out.innerHTML = '<span class="muted">Thinking…</span>';
    try { await TS.stream("/api/ai/chain", body, (t) => (out.innerHTML = TS.md(t))); } catch (e) { out.innerHTML = `<span class="down">${esc(e.message)}</span>`; }
    out.classList.remove("cursor");
  }
  function select(s, loose) {
    sel = { s, loose };
    document.querySelectorAll(".nd").forEach((d) => d.classList.toggle("sel", d.dataset.s === s));
    details(s);
  }
  async function details(s) {
    const { nodes, edges } = nodesAndEdges();
    let n = nodes[s];
    if (!n) { const q = (await api(`/api/quotes?symbols=${encodeURIComponent(s)}`).catch(() => []))[0] || {}; n = { symbol: s, name: q.name || s, price: q.price, changePct: q.changePct }; }
    const sup = edges.filter((e) => e.to === s), cus = edges.filter((e) => e.from === s);
    const relList = (list, key, verb) => list.map((e) => `<div class="rel" data-s="${esc(e[key])}"><span>${verb} <b>${esc(e[key])}</b> <span class="dim">${esc(nodes[e[key]]?.name || "")}</span><div class="dim" style="font-size:11px">${esc(e.what)}${e.kind === "ai" ? " · AI, unverified" : ""}</div></span><span class="imp">${"●".repeat(e.importance)}${"○".repeat(3 - e.importance)}</span></div>`).join("");
    $("#side").innerHTML = `<button class="btn sm ghost" id="back">← Chain overview</button>
      <div style="margin:10px 0 4px"><span class="pill" style="border-color:${(ROLE[n.role] || ROLE.supplier)[0]}">${esc((ROLE[n.role] || ["", "Related company"])[1])}</span></div>
      <h3 style="margin:4px 0">${esc(n.symbol)} <span class="muted" style="font-size:13px;font-weight:400">${esc(n.name || "")}</span></h3>
      <div><span class="num" style="font-size:20px;font-weight:600">${price(n.price)}</span> <span class="num ${cls(n.changePct)}">${pct(n.changePct)}</span> ${n.signal ? `<span class="sig ${TS.sigClass(n.signal)}">${n.signal}</span>` : ""} ${n.score != null ? `<span class="dim">score ${Math.round(n.score)}</span>` : ""}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0"><button class="btn sm" id="dR">🔍 Research</button>${s !== sym ? `<button class="btn sm" id="dC">⛓ Centre chain here</button><button class="btn sm primary" id="dX">⚠ What if it's disrupted?</button>` : ""}</div>
      <div id="impact"></div><div id="aiOut" class="md"></div>
      ${sup.length ? `<div class="sec"><h4>Buys from (${sup.length})</h4>${relList(sup, "from", "←")}</div>` : ""}
      ${cus.length ? `<div class="sec"><h4>Sells to (${cus.length})</h4>${relList(cus, "to", "→")}</div>` : ""}
      ${!sup.length && !cus.length ? '<div class="dim" style="font-size:12px">No verified links for this company in the current view. Centre the chain on it to explore its own suppliers and customers.</div>' : ""}`;
    $("#back").onclick = () => { sel = null; clearImpact(); document.querySelectorAll(".nd.sel").forEach((d) => d.classList.remove("sel")); side(); };
    $("#dR").onclick = () => window.open(`/research.html?symbol=${encodeURIComponent(s)}`, "_blank");
    if ($("#dC")) $("#dC").onclick = () => go(s);
    if ($("#dX")) $("#dX").onclick = () => {
      if (view !== "company") setView("company");
      const hit = downstream(s);
      sel.disrupt = true;
      document.querySelectorAll(".nd").forEach((d) => { d.classList.toggle("hit", hit.has(d.dataset.s) && d.dataset.s !== s); d.classList.toggle("dim", !hit.has(d.dataset.s)); });
      document.querySelectorAll("#edges path:not(.hit)").forEach((p) => p.classList.toggle("dim", !(hit.has(p.dataset.a) && hit.has(p.dataset.b))));
      const reached = hit.has(sym);
      $("#impact").innerHTML = `<div class="hint" style="border-color:var(--down)"><b>Contagion map:</b> a disruption at <b>${esc(s)}</b> flows to <b>${hit.size - 1}</b> compan${hit.size - 1 === 1 ? "y" : "ies"} in this chain${reached ? `, <b class="down">including ${esc(sym)}</b>` : `; <b>${esc(sym)}</b> isn't directly exposed through verified links`}. Highlighted in red. <a href="#" id="clr">Clear</a></div>`;
      $("#clr").onclick = (e) => { e.preventDefault(); clearImpact(); };
      streamAI({ symbol: sym, disrupt: s });
    };
    $("#side").querySelectorAll(".rel[data-s]").forEach((el) => (el.onclick = () => select(el.dataset.s)));
  }
  function clearImpact() { if (sel) sel.disrupt = false; document.querySelectorAll(".nd").forEach((d) => d.classList.remove("hit", "dim")); document.querySelectorAll("#edges path").forEach((p) => p.classList.remove("dim")); const i = $("#impact"); if (i) i.innerHTML = ""; }

  // ---------------- AI suggestions (unverified)
  $("#aiMore").onclick = async () => {
    const b = $("#aiMore"); b.disabled = true; b.innerHTML = '<span class="spin"></span> Asking the AI…';
    try {
      const r = await api(`/api/chainai/${encodeURIComponent(sym)}`);
      if (r.error) throw new Error(r.error);
      const known = new Set(G.edges.flatMap((e) => [e.from, e.to]));
      aiLinks = { suppliers: r.suppliers.filter((x) => !known.has(x.symbol) && x.symbol !== sym), customers: r.customers.filter((x) => !known.has(x.symbol) && x.symbol !== sym) };
      const n = aiLinks.suppliers.length + aiLinks.customers.length;
      TS.toast(n ? `AI suggested ${n} more link(s), marked unverified` : "The AI found no additional links it could match to listed companies");
      setView("company"); side();
    } catch (e) { TS.toast("AI suggestions failed: " + e.message, 5000); }
    b.disabled = false; b.textContent = "✨ AI: find more links";
  };

  // ---------------- near-live prices
  setInterval(async () => {
    if (!G || document.hidden) return;
    const syms = Object.keys(G.nodes);
    const q = await api(`/api/quotes?symbols=${encodeURIComponent(syms.slice(0, 40).join(","))}`).catch(() => []);
    q.forEach((x) => { if (G.nodes[x.symbol]) { G.nodes[x.symbol].changePct = x.changePct; G.nodes[x.symbol].price = x.price; const el = document.querySelector(`.nd[data-s="${CSS.escape(x.symbol)}"] .chg`); if (el) { el.textContent = pct(x.changePct, 1); el.className = "chg " + cls(x.changePct); } } });
  }, 30000);
  UX.shortcut("i", "Toggle company / industry view", () => setView(view === "company" ? "industry" : "company"));
  UX.shortcut("f", "Fit the chain to the screen", () => fit());
  load();
})();
</script>
</body>
</html>
